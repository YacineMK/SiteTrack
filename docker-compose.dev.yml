services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["redis-server", "--port", "${REDIS_PORT}", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $$REDIS_PORT -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: dockerfile.seed
    restart: "no"
    network_mode: host
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- SigNoz observability stack (profile: signoz) ---
  # Bridge network, OTLP exposed on host ports 4317/4318, UI on 3301.
  # Enable with: docker compose -f docker-compose.dev.yml --profile signoz up -d
  signoz-zookeeper:
    profiles: ["signoz"]
    image: zookeeper:3.8
    container_name: signoz-zookeeper
    hostname: zookeeper-1
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=0.0.0.0:2888:3888;2181
      - ZOO_AUTOPURGE_PURGEINTERVAL=1
      - ZOO_4LW_COMMANDS_WHITELIST=*
    volumes:
      - signoz_zookeeper:/data
    networks:
      - signoz

  signoz-clickhouse:
    profiles: ["signoz"]
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    hostname: clickhouse
    tty: true
    depends_on:
      - signoz-zookeeper
    volumes:
      - ./monitoring/signoz/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - ./monitoring/signoz/clickhouse-users.xml:/etc/clickhouse-server/users.xml
      - ./monitoring/signoz/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./monitoring/signoz/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - signoz_clickhouse:/var/lib/clickhouse/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - signoz

  signoz-otel-collector-migrator:
    profiles: ["signoz"]
    image: signoz/signoz-schema-migrator:0.102.1
    container_name: signoz-otel-collector-migrator
    command: ["--dsn=tcp://clickhouse:9000"]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    networks:
      - signoz

  signoz-otel-collector:
    profiles: ["signoz"]
    image: signoz/signoz-otel-collector:0.102.1
    container_name: signoz-otel-collector
    hostname: signoz-otel-collector
    user: root
    command:
      - "--config=/etc/otel-collector-config.yaml"
      - "--manager-config=/etc/manager-config.yaml"
      - "--copy-path=/var/tmp/collector-config.yaml"
      - "--feature-gates=-pkg.translator.prometheus.NormalizeName"
    volumes:
      - ./monitoring/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./monitoring/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=sitetrack-host,os.type=linux
      - DOCKER_MULTI_NODE_CLUSTER=false
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-otel-collector-migrator:
        condition: service_completed_successfully
      signoz-query-service:
        condition: service_healthy
    networks:
      - signoz

  signoz-query-service:
    profiles: ["signoz"]
    image: signoz/query-service:0.49.0
    container_name: signoz-query-service
    command: ["-config=/root/config/prometheus.yml"]
    volumes:
      - ./monitoring/signoz/prometheus.yml:/root/config/prometheus.yml
      - signoz_query:/var/lib/signoz/
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - ALERTMANAGER_API_PREFIX=http://signoz-alertmanager:9093/api/
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-otel-collector-migrator:
        condition: service_completed_successfully
    networks:
      - signoz

  signoz-alertmanager:
    profiles: ["signoz"]
    image: signoz/alertmanager:0.23.5
    container_name: signoz-alertmanager
    volumes:
      - signoz_alertmanager:/data
    command:
      - --queryService.url=http://signoz-query-service:8085
      - --storage.path=/data
    depends_on:
      signoz-query-service:
        condition: service_healthy
    restart: on-failure
    networks:
      - signoz

  signoz-frontend:
    profiles: ["signoz"]
    image: signoz/frontend:0.49.0
    container_name: signoz-frontend
    restart: on-failure
    depends_on:
      - signoz-alertmanager
      - signoz-query-service
    ports:
      - "3301:3301"
    volumes:
      - ./monitoring/signoz/nginx-config.conf:/etc/nginx/conf.d/default.conf
    networks:
      - signoz

volumes:
  postgres_data:
  redis_data:
  signoz_zookeeper:
  signoz_clickhouse:
  signoz_query:
  signoz_alertmanager:

networks:
  signoz:
