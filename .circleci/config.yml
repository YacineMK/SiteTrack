version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
      - run: go build ./...
      - run: go test ./... -count=1
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

  e2e:
    # dockertest spins up Postgres + Redis containers, so the job needs a real
    # Docker daemon. The machine executor gives us one; remote-docker doesn't
    # share the host network dockertest expects.
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: install go 1.26
          command: |
            curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" -o /tmp/go.tgz
            sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tgz
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
      - run: go version
      - restore_cache:
          keys:
            - go-mod-e2e-v1-{{ checksum "go.sum" }}
      - run: go test -tags=e2e ./test/e2e -count=1 -timeout=10m
      - save_cache:
          key: go-mod-e2e-v1-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod

workflows:
  ci:
    jobs:
      - build
      - e2e:
          requires:
            - build
